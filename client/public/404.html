<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>時間割管理</title>
  <script>
    // GitHub Pages SPA リダイレクト
    // アクセスした URL を sessionStorage に保存して index.html にリダイレクト
    sessionStorage.redirect = location.href;
    var base = location.pathname.split('/').slice(0, 2).join('/'); // /timetable-web
    location.replace(base + '/');
  </script>
</head>

</html>
